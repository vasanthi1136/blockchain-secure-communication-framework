<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthNode Executive | Secure Login</title>
    <meta name="description" content="Secure login portal for the HealthNode Executive IoT Security Platform.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --brand: #6366f1;
            --brand-glow: rgba(99, 102, 241, 0.4);
            --brand-hover: #4f52d9;
            --success: #10b981;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --glass: rgba(30, 41, 59, 0.75);
            --border: rgba(255, 255, 255, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(16, 185, 129, 0.07) 0%, transparent 40%),
                radial-gradient(at top left, #1e293b 0%, #0f172a 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated grid background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* Floating orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: float 8s ease-in-out infinite;
            z-index: 0;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.12) 0%, transparent 70%);
            bottom: -80px;
            right: -80px;
            animation-delay: -4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(20px, -20px) scale(1.05);
            }
        }

        /* Login card */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        /* Brand header */
        .brand-header {
            text-align: center;
            margin-bottom: 36px;
            animation: fadeDown 0.6s ease both;
        }

        .brand-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--brand), #4f52d9);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 0 40px var(--brand-glow);
            font-size: 1.8rem;
        }

        .brand-title {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .brand-title span {
            color: var(--brand);
        }

        .brand-sub {
            margin-top: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* Card */
        .login-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(99, 102, 241, 0.1) inset;
            animation: fadeUp 0.7s ease 0.1s both;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
        }

        .card-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 18px;
            background: var(--brand);
            border-radius: 4px;
        }

        /* Form fields */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .form-group input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px 14px 46px;
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
        }

        .form-group input::placeholder {
            color: rgba(148, 163, 184, 0.4);
        }

        .form-group input:focus {
            border-color: var(--brand);
            background: rgba(99, 102, 241, 0.06);
            box-shadow: 0 0 0 3px var(--brand-glow);
        }

        .form-group input:focus+.input-focus-icon,
        .input-wrapper:focus-within .input-icon {
            color: var(--brand);
        }

        /* Toggle password */
        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: color 0.2s;
        }

        .toggle-pw:hover {
            color: var(--brand);
        }

        /* Error message */
        .error-msg {
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.875rem;
            color: var(--danger);
            animation: shake 0.4s ease;
        }

        .error-msg.show {
            display: flex;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            20% {
                transform: translateX(-6px);
            }

            40% {
                transform: translateX(6px);
            }

            60% {
                transform: translateX(-4px);
            }

            80% {
                transform: translateX(4px);
            }
        }

        /* Submit button */
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, var(--brand) 0%, #4f52d9 100%);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
            margin-top: 8px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-login:hover::before {
            opacity: 1;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.8;
        }

        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Hint bar */
        .hint-bar {
            margin-top: 24px;
            background: rgba(99, 102, 241, 0.06);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hint-bar span {
            color: var(--brand);
            font-weight: 600;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 0.78rem;
            color: rgba(148, 163, 184, 0.4);
            animation: fadeUp 0.7s ease 0.3s both;
        }

        .live-dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--success);
            border-radius: 50%;
            margin-right: 5px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0% {
                opacity: 0.2;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }

        /* Animations */
        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <!-- Background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-wrapper">

        <!-- Brand -->
        <div class="brand-header">
            <div class="brand-icon">🛡️</div>
            <div class="brand-title">Health<span>Node</span> Executive</div>
            <div class="brand-sub">IoT Security Platform &nbsp;|&nbsp; Secure Access Portal</div>
        </div>

        <!-- Card -->
        <div class="login-card">
            <div class="card-title">Administrator Login</div>

            <!-- Error message -->
            <div class="error-msg" id="errorMsg">
                🔒 <span>Access Denied — Invalid credentials.</span>
            </div>

            <form id="loginForm" autocomplete="off" novalidate>

                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="off"
                            required>
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input type="password" id="password" name="password" placeholder="Enter password"
                            autocomplete="off" required>
                        <button type="button" class="toggle-pw" id="togglePw" title="Show/Hide password"
                            aria-label="Toggle password visibility">👁️</button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-login" id="loginBtn">
                    <span class="btn-text"> &nbsp;Authenticate &amp; Enter</span>
                    <div class="spinner"></div>
                </button>

            </form>

            <!-- Hint -->
            <div class="hint-bar">
                🔐 &nbsp;Credentials: &nbsp;<span>admin</span> &nbsp;/&nbsp; <span>1234</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <span class="live-dot"></span>
            TLS 1.3 Encrypted &nbsp;|&nbsp; HealthNode Executive &copy; 2026
        </div>
    </div>

    <script>
        // ── Toggle password visibility ─────────────────────────────────────
        const togglePw = document.getElementById('togglePw');
        const pwInput = document.getElementById('password');
        togglePw.addEventListener('click', () => {
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            togglePw.textContent = isHidden ? '🙈' : '👁️';
        });

        // ── Login form validation ──────────────────────────────────────────
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // Hide any previous error
            errorMsg.classList.remove('show');

            if (username === 'admin' && password === '1234') {
                // ✅ Correct — animate then redirect
                loginBtn.classList.add('loading');
                sessionStorage.setItem('hn_authenticated', 'true');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 900);
            } else {
                // ❌ Wrong — show error with shake
                errorMsg.classList.remove('show');
                void errorMsg.offsetWidth; // reflow to re-trigger animation
                errorMsg.classList.add('show');
                pwInput.value = '';
                pwInput.focus();
                // Also shake the card
                const card = document.querySelector('.login-card');
                card.style.animation = 'none';
                void card.offsetWidth;
                card.style.animation = '';
            }
        });

        // Clear error on typing
        ['username', 'password'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                errorMsg.classList.remove('show');
            });
        });

        // Allow Enter key to submit
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') form.requestSubmit();
        });
    </script>
</body>

</html>
